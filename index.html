
<div class="fv-game-root" data-fv-game-root>
<style>
.fv-game-root{--fv-accent:#6558d3;--fv-green:#13a96b;--fv-ink:#26324b;--fv-soft:#f3f5fb;box-sizing:border-box;width:100%;min-height:min(760px,95dvh);padding:clamp(10px,2vw,22px);font-family:inherit;color:var(--fv-ink);background:radial-gradient(circle at 12% 5%,#efeaff 0,transparent 32%),linear-gradient(145deg,#f9fbff,#eef8f5);border:1px solid #e3e7f2;border-radius:20px;overflow:auto;isolation:isolate}
.fv-game-root *{box-sizing:border-box}
.fv-game-root button{font:inherit}
.fv-game-root .fv-game-shell{max-width:1120px;margin:0 auto}
.fv-game-root .fv-game-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;padding:12px 14px;background:rgba(255,255,255,.9);border:1px solid #e5e7f0;border-radius:15px;box-shadow:0 10px 28px rgba(38,50,75,.07)}
.fv-game-root .fv-game-brand{display:flex;align-items:center;gap:11px;min-width:0}
.fv-game-root .fv-game-logo{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
.fv-game-root .fv-game-kicker{margin:0 0 2px;color:var(--fv-green);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.fv-game-root .fv-game-title{margin:0;color:var(--fv-ink);font-size:clamp(1.15rem,3vw,1.65rem);line-height:1.2;overflow-wrap:anywhere}
.fv-game-root .fv-game-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.fv-game-root .fv-game-btn{border:1px solid #d8dced;border-radius:9px;padding:8px 11px;background:#fff;color:#4b5570;font-weight:750;cursor:pointer}
.fv-game-root .fv-game-btn:hover{border-color:var(--fv-accent);color:var(--fv-accent)}
.fv-game-root .fv-game-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}
.fv-game-root .fv-game-main,.fv-game-root .fv-game-side{background:rgba(255,255,255,.94);border:1px solid #e4e7f0;border-radius:17px;box-shadow:0 12px 30px rgba(38,50,75,.08)}
.fv-game-root .fv-game-main{padding:clamp(10px,2vw,18px)}
.fv-game-root .fv-game-progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:#687187;font-size:.9rem;font-weight:700}
.fv-game-root .fv-game-progress{height:8px;flex:1;background:#e9ecf4;border-radius:999px;overflow:hidden}
.fv-game-root .fv-game-progress-bar{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--fv-accent),#8b7cf6);border-radius:inherit;transition:width .25s ease}
.fv-game-root .fv-game-board{width:min(100%,720px);margin:0 auto;aspect-ratio:13/13;padding:clamp(5px,1vw,9px);background:#fff;border:1px solid #dfe3ed;border-radius:14px;box-shadow:inset 0 0 0 3px #f3f5fa}
.fv-game-root .fv-game-stage{position:relative;width:100%;height:100%;touch-action:none;user-select:none}
.fv-game-root .fv-game-grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(13,minmax(0,1fr));gap:clamp(1px,.3vw,3px);width:100%;height:100%}
.fv-game-root .fv-game-cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border:0;border-radius:clamp(2px,.5vw,6px);background:#f1f3f8;color:#27334d;font-size:clamp(9px,2.2vw,24px);font-weight:850;line-height:1;cursor:crosshair;position:relative;z-index:2}
.fv-game-root .fv-game-cell:hover{background:#e8e4ff;color:#5143c7}
.fv-game-root .fv-game-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fv-game-root .fv-game-note{margin:10px 0 0;text-align:center;color:#788196;font-size:.82rem}
.fv-game-root .fv-game-side{display:none;padding:16px;max-height:680px;overflow:auto}
.fv-game-root .fv-game-side-title{margin:0 0 10px;font-size:1rem;color:#36415a}
.fv-game-root .fv-game-words{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.fv-game-root .fv-game-word{padding:8px 10px;border-radius:8px;background:#f5f6fa;color:#46516a;font-size:.9rem;font-weight:750;overflow-wrap:anywhere;transition:.2s}
.fv-game-root .fv-game-word.is-found{text-decoration:line-through;color:#7e8a9e;background:#e7f8f0}
.fv-game-root .fv-game-complete{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(26,33,50,.64)}
.fv-game-root .fv-game-complete.is-open{display:flex}
.fv-game-root .fv-game-dialog{width:min(420px,100%);padding:28px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
.fv-game-root .fv-game-dialog-icon{font-size:3rem;line-height:1}
.fv-game-root .fv-game-dialog-title{margin:10px 0 6px;font-size:1.5rem;color:#2c3852}
.fv-game-root .fv-game-dialog p{margin:0 0 18px;color:#69748a}
.fv-game-root .fv-game-restart{border:0;border-radius:10px;padding:11px 18px;background:var(--fv-green);color:#fff;font-weight:800;cursor:pointer}
.fv-game-root:fullscreen{width:100vw;height:100vh;max-width:none;border:0;border-radius:0;padding:clamp(8px,2vw,22px)}
@media(max-width:760px){.fv-game-root{min-height:auto;padding:8px;border-radius:13px}.fv-game-root .fv-game-header{align-items:flex-start}.fv-game-root .fv-game-logo{width:40px;height:40px;flex-basis:40px}.fv-game-root .fv-game-layout{grid-template-columns:1fr}.fv-game-root .fv-game-side{max-height:150px;padding:11px}.fv-game-root .fv-game-words{display:flex;flex-wrap:wrap;gap:5px}.fv-game-root .fv-game-word{padding:5px 7px;font-size:.78rem}.fv-game-root .fv-game-board{width:min(100%,calc((100dvh - 210px) * 13 / 13));min-width:240px}.fv-game-root .fv-game-note{font-size:.76rem}.fv-game-root .fv-game-btn{padding:7px 9px;font-size:.78rem}}
@media(max-width:470px){.fv-game-root .fv-game-header{display:grid;grid-template-columns:1fr}.fv-game-root .fv-game-actions{justify-content:stretch}.fv-game-root .fv-game-btn{flex:1}.fv-game-root .fv-game-board{min-width:0}.fv-game-root .fv-game-cell{font-size:clamp(8px,4vw,18px)}}
</style>

  function finish(event){if(!isSelecting||event.pointerId!==pointerId)return;event.preventDefault();isSelecting=false;checkWord();drawFound()}
  function checkWord(){if(startIdx<0||endIdx<0)return;var a=coords(startIdx),b=coords(endIdx),dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y),len=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y)),selected='',indices=[];for(var i=0;i<=len;i++){var idx=indexAt(a.x+i*dx,a.y+i*dy);selected+=grid.children[idx].dataset.char;indices.push(idx)}var reverse=selected.split('').reverse().join('');var item=words.find(function(word){return !word.found&&(word.word===selected||word.word===reverse)});if(!item)return;item.found=true;item.indices=indices;foundCount++;updateStatus();if(foundCount===words.length&&words.length){setTimeout(function(){complete.classList.add('is-open')},350)}}
  function updateStatus(){score.textContent=foundCount;progress.style.width=(words.length?foundCount/words.length*100:0)+'%';root.querySelectorAll('.fv-game-word').forEach(function(item){var word=words.find(function(entry){return entry.word===item.dataset.word});item.classList.toggle('is-found',!!(word&&word.found))})}
  function restart(){words.forEach(function(item){item.found=false;delete item.indices});foundCount=0;startIdx=endIdx=-1;complete.classList.remove('is-open');updateStatus();drawFound()}
  function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen()}else{root.requestFullscreen&&root.requestFullscreen()}}
  grid.addEventListener('pointerdown',begin);grid.addEventListener('pointermove',move);grid.addEventListener('pointerup',finish);grid.addEventListener('pointercancel',finish);
  root.querySelectorAll('[data-action="restart"]').forEach(function(button){button.addEventListener('click',restart)});
  root.querySelector('[data-action="fullscreen"]').addEventListener('click',toggleFullscreen);
  document.addEventListener('fullscreenchange',function(){var button=root.querySelector('[data-action="fullscreen"]');button.textContent=document.fullscreenElement?'Выйти':'На весь экран';setTimeout(resizeCanvas,80)});
  if(window.ResizeObserver)new ResizeObserver(resizeCanvas).observe(grid);else window.addEventListener('resize',resizeCanvas);
  setTimeout(resizeCanvas,80);updateStatus();
})();
</script>
</div>
